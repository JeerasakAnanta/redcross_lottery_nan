version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8000
    env_file:
      - .env
    volumes:
      - .:/app
    command: uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: redcross_lottery
      MYSQL_USER: lottery_user
      MYSQL_PASSWORD: lottery_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: