[project]
name = "redcross-lottery-api"
version = "1.0.0"
description = "A lottery management system built with FastAPI and EasyOCR"
authors = [{name = "Red Cross Lottery Team"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "ISC"}

# Standard dependencies
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "pymysql>=1.1.0",
    "cryptography>=41.0.7",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pillow>=10.2.0",
    "aiofiles>=23.2.1",
    "easyocr>=1.7.0",
    "opencv-python>=4.8.1.78",
    "numpy>=1.24.3",
]

[project.urls]
Homepage = "https://github.com/redcross/lottery-api"
Repository = "https://github.com/redcross/lottery-api"

[tool.uv]
# This line fixes your hatchling error! 
# It tells uv "This is a web app, do not try to build it into a library."
package = false 

[dependency-groups]
# This is the modern uv way to declare dev tools
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "taskipy>=1.14.1", # Added taskipy to handle our custom scripts
]

# --- Task Runner Configuration ---

[tool.taskipy.tasks]
dev = "uvicorn main:app --reload --host 0.0.0.0 --port 8000"
migrate = "alembic upgrade head"
migrate-create = "alembic revision --autogenerate"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."

# --- Tool Configurations ---

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]